<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#181711"/>
  
  <!-- Decorative border with batik-inspired pattern -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#dab80b" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Spa/Lotus icon - representing Jawir -->
  <g transform="translate(50,52)">
    <!-- Center petal -->
    <ellipse cx="0" cy="-8" rx="8" ry="18" fill="#dab80b"/>
    
    <!-- Left petals -->
    <ellipse cx="-12" cy="-2" rx="7" ry="16" fill="#dab80b" transform="rotate(-25)"/>
    <ellipse cx="-20" cy="4" rx="6" ry="14" fill="#dab80b" opacity="0.8" transform="rotate(-45)"/>
    
    <!-- Right petals -->
    <ellipse cx="12" cy="-2" rx="7" ry="16" fill="#dab80b" transform="rotate(25)"/>
    <ellipse cx="20" cy="4" rx="6" ry="14" fill="#dab80b" opacity="0.8" transform="rotate(45)"/>
    
    <!-- Center accent -->
    <circle cx="0" cy="8" r="6" fill="#f1f0ea"/>
    <circle cx="0" cy="8" r="3" fill="#dab80b"/>
  </g>
  
  <!-- "J" letter subtle hint -->
  <text x="50" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-weight="bold" font-size="10" fill="#f1f0ea" opacity="0.6">JAWIR</text>
</svg>
